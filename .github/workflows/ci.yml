name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Python unit tests (patcher helpers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests/python -v

  static-suite:
    name: Static suite (fixture build + patch + fail-closed checks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch pinned toolchain
        run: |
          python3 -m pip install --quiet androguard==4.1.4
          bash scripts/bootstrap_tools.sh
      - name: Run static suite
        run: |
          source tools/tool-env.sh
          bash tests/run_tests.sh | tee /tmp/test.log
          grep -q ", 0 failed" /tmp/test.log
