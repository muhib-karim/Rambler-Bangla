<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">Rambler Bangla v31.3.0 — Feature Overview Poster</title>
  <desc id="desc">Six-card visual summary of Rambler Bangla v31.3.0 features: Bengali-first Rambler+, Native @Mention Strip, Live AMOLED Toggle and Themes, Hex Waveforms and Productivity, Clipboard Drag-to-Reorder and Power Tools, and Fail-Closed Morphe Architecture.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152B"/>
      <stop offset="1" stop-color="#0E2849"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#113152"/>
      <stop offset="1" stop-color="#0C2440"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="540" rx="18" fill="url(#canvas)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Header -->
    <text x="44" y="52" font-size="24" font-weight="700" fill="#FFFFFF">Everything Inside Rambler Bangla <tspan fill="#F6B13E">v31.3.0</tspan></text>
    <text x="44" y="78" font-size="14.5" fill="#9EC0E0">60 selectable Morphe patches for Gboard 18.5.4 — modular, conflict-free, fail-closed, and GPL-3.0 open source.</text>

    <!-- Row 1 -->
    <!-- Card 1 -->
    <g transform="translate(44 104)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="118" height="24" rx="12" fill="#1C4670"/>
      <text x="79" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">VOICE ENGINE</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">Bengali-First Rambler+</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">Unconditional Rambler+ activation, live Gboard</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">locale handoff, per-sentence EN/BN routing,</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">2,265 Avro pairs &amp; CMUdict loanwords.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12" fill="#9BE0B0">ami bhalo achi -&gt; Bengali Unicode · #tags safe</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(450 104)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="128" height="24" rx="12" fill="#1C4670"/>
      <text x="84" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">NATIVE STRIP</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">Native @Mention Strip</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">100% personalized @handles &amp; email domains</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">injected straight into Gboard's own strip —</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">zero overlay, native themes &amp; drag-to-remove.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12.5" fill="#F6B13E">@grok  |  @claude  |  @gmail.com  (auto-learns)</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(856 104)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="128" height="24" rx="12" fill="#1C4670"/>
      <text x="84" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">NEW IN v31.3.0</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">Live AMOLED Toggle &amp; Glass</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">In-app AMOLED #000000 toggle (off by default</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">for balanced dark gray), Frosted Glass blur,</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">Rboard / ZIP Themes &amp; Rounded Key Shapes.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12.5" fill="#9EC0E0">Live AMOLED Switch · Frosted Blur · Rboard</text>
    </g>

    <!-- Row 2 -->
    <!-- Card 4 -->
    <g transform="translate(44 318)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="154" height="24" rx="12" fill="#1C4670"/>
      <text x="97" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">RAMBLER POWER</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">Hex Waveforms &amp; AI Rules</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">Hex Dot Scope &amp; Android Wave animations,</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">Per-App Custom Instructions, MUSE_STATS</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">dictionary, Contact Sync &amp; Spacebar Hold.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12.5" fill="#9BE0B0">Snippets · Find/Replace · Stats · Toolbar Overflow</text>
    </g>

    <!-- Card 5 -->
    <g transform="translate(450 318)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="128" height="24" rx="12" fill="#1C4670"/>
      <text x="84" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">NEW IN v31.3.0</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">Drag Clipboard, Calc &amp; LAN</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">Tap &amp; hold drag-to-reorder clipboards (saved</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">permanently), Web Clipboard + image sync,</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">LAN FTP, Calculator, OCR &amp; AI Writing Tools.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12.5" fill="#9EC0E0">Drag Reorder · Editing Shortcuts · Bluetooth Mic</text>
    </g>

    <!-- Card 6 -->
    <g transform="translate(856 318)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="140" height="24" rx="12" fill="#1C4670"/>
      <text x="90" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9BE0B0">PRODUCTION CI</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">Fail-Closed &amp; Morphe Ready</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">1-click Morphe Manager source, SHA-256</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">guards, side-by-side package rename, 313</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">patch tests + Android 15 KVM smoke checks.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12" fill="#9BE0B0">88 Python · 22 Static · 313 Gradle · API 35 KVM</text>
    </g>
  </g>
</svg>
