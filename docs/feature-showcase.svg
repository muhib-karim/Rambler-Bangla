<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">Rambler Bangla v32.1.0 — Feature Overview Poster</title>
  <desc id="desc">Six-card visual summary of Rambler Bangla v32.1.0 features: Live Gemini Rambler+ Bangla &amp; Mixed Script Prompting, L1-L4 Bengali Orthography Engine, Native @Mention Strip, Redesigned 4-Section Patches UI, Hex Waveforms and Productivity, Clipboard Drag-to-Reorder and Power Tools, and All-Android In-App Auto-Updater with Zero-Delay Bengali Lexicon and Slimmer APK.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152B"/>
      <stop offset="1" stop-color="#0E2849"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#113152"/>
      <stop offset="1" stop-color="#0C2440"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="540" rx="18" fill="url(#canvas)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Header -->
    <text x="44" y="52" font-size="24" font-weight="700" fill="#FFFFFF">Everything Inside Rambler Bangla <tspan fill="#F6B13E">v32.1.0</tspan></text>
    <text x="44" y="78" font-size="14.5" fill="#9EC0E0">60 selectable Morphe patches for Gboard 18.5.4 — 3-mode Bangla/Mixed/English voice, in-app updates, custom logo &amp; GPL-3.0.</text>

    <!-- Row 1 -->
    <!-- Card 1 -->
    <g transform="translate(44 104)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="134" height="24" rx="12" fill="#1C4670"/>
      <text x="87" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">3-MODE VOICE</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">Bangla, Mixed &amp; English</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">English (US) = English/Phonetic Latin · Bangla =</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">100% Natural Bengali · abc-&gt;Bangla = True Mixed</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">Bangla + English inside the same sentence.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12" fill="#9BE0B0">Live Gemini Bangla prompt · 0ms zero-delay spell</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(450 104)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="128" height="24" rx="12" fill="#1C4670"/>
      <text x="84" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">NATIVE STRIP</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">Native @Mention Strip</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">100% personalized @handles &amp; email domains</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">injected straight into Gboard's own strip —</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">zero overlay, native themes &amp; drag-to-remove.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12.5" fill="#F6B13E">@grok  |  @claude  |  @gmail.com  (auto-learns)</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(856 104)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="144" height="24" rx="12" fill="#1C4670"/>
      <text x="92" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">LOOK &amp; LAUNCHER</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">AMOLED, Logo &amp; Hide Icon</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">Custom adaptive Rambler Bangla logo, live Hide</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">Launcher Icon toggle, AMOLED #000000 switch</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">(off by default), Frosted Glass &amp; Rboard Themes.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12.5" fill="#9EC0E0">Hide App Icon · AMOLED Switch · Frosted Blur</text>
    </g>

    <!-- Row 2 -->
    <!-- Card 4 -->
    <g transform="translate(44 318)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="154" height="24" rx="12" fill="#1C4670"/>
      <text x="97" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">RAMBLER POWER</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">Hex Waveforms &amp; AI Rules</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">Hex Dot Scope &amp; Android Wave animations,</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">Per-App Custom Instructions, MUSE_STATS</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">dictionary, Contact Sync &amp; Spacebar Hold.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12.5" fill="#9BE0B0">Snippets · Find/Replace · Stats · Toolbar Overflow</text>
    </g>

    <!-- Card 5 -->
    <g transform="translate(450 318)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="140" height="24" rx="12" fill="#1C4670"/>
      <text x="90" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">POWER TOOLS</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">Drag Clipboard, Calc &amp; LAN</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">Tap &amp; hold drag-to-reorder clipboards (saved</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">permanently), Web Clipboard + image sync,</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">LAN FTP, Calculator, OCR &amp; AI Writing Tools.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12.5" fill="#9EC0E0">Drag Reorder · Editing Shortcuts · Bluetooth Mic</text>
    </g>

    <!-- Card 6 -->
    <g transform="translate(856 318)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="144" height="24" rx="12" fill="#1C4670"/>
      <text x="92" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9BE0B0">NEW IN v32.1.0</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">Live Gemini Bangla + Slim</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">Direct Gemini Rambler+ Bangla Academy prompt,</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">0ms non-blocking 89k lexicon, all-Android OTA,</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">and ~3.9 MB slimmer APK (all 60 patches intact).</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12" fill="#9BE0B0">Live Gemini Prompt · 0ms Delay · Slimmer APK</text>
    </g>
  </g>
</svg>
